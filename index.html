<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Between Us</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #140d26; }
  .root {
    position: relative; min-height: 100vh; width: 100%; outline: none; color: #f4eee4;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background:
      radial-gradient(120% 80% at 50% 108%, rgba(242,198,109,0.22), rgba(242,198,109,0) 60%),
      linear-gradient(180deg, #140d26 0%, #1e1436 42%, #2c1c4a 78%, #3a2456 100%);
    overflow: hidden; display: flex; flex-direction: column; align-items: center;
  }
  .stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
  .star { position: absolute; display: block; transform: translate(-50%, -50%); color: #fdf6e6;
    filter: drop-shadow(0 0 2px rgba(253,246,230,0.95)) drop-shadow(0 0 7px rgba(242,198,109,0.6)); }
  .star svg { display: block; width: 100%; height: 100%; }
  .wrap {
    position: relative; width: min(560px, 92vw); padding: clamp(28px,6vh,56px) 0 40px;
    display: flex; flex-direction: column; align-items: center; flex: 1;
  }
  header { text-align: center; margin-bottom: clamp(20px,4vh,36px); }
  .moon { margin-bottom: 10px; filter: drop-shadow(0 0 14px rgba(242,198,109,0.5)); }
  h1.title { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: clamp(2rem,7vw,2.7rem); margin: 0; letter-spacing: -0.01em; }
  .date { margin: 8px 0 0; color: #c3b6db; font-size: 0.95rem; }
  .persp { width: 100%; perspective: 1400px; }
  .card {
    position: relative; width: 100%; min-height: min(56vh, 380px);
    transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.noanim { transition: none; }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 22px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .face.back { transform: rotateY(180deg); }
  .frontinner { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 0 24px; }
  .num { font-family: 'Fraunces', serif; font-size: clamp(3rem,12vw,4.5rem); line-height: 1; opacity: 0.9; }
  .hint { margin: 0; color: #cabfe4; font-size: 0.98rem; }
  .backinner { display: flex; flex-direction: column; height: 100%; width: 100%; padding: 26px 24px 20px; }
  .qwrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .qtext { font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: clamp(1.5rem,5.2vw,2.1rem); line-height: 1.28; text-align: center; margin: 0; letter-spacing: -0.01em; }
  .pill { align-self: center; display: inline-flex; align-items: center; gap: 7px; padding: 5px 13px; border-radius: 999px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.01em; }
  .pdot { width: 6px; height: 6px; border-radius: 6px; }
  .weekly { margin-left: 2px; padding-left: 8px; opacity: 0.85; font-weight: 400; }
  .controls { display: flex; justify-content: space-between; align-items: center; }
  .iconbtn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #e5ddf1; transition: all .2s ease; }
  .takelabel { color: #a99cc6; font-size: 0.82rem; }
  .dots { display: flex; gap: 10px; margin: 22px 0 18px; align-items: center; }
  .dot { height: 9px; border: none; cursor: pointer; padding: 0; border-radius: 9px; transition: all .3s ease; }
  .nav { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }
  .navbtn { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 999px; cursor: pointer; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); color: #f4eee4; transition: all .2s ease; }
  .navbtn:disabled { cursor: default; background: rgba(255,255,255,0.03); color: #5b5175; opacity: 0.5; }
  .counter { min-width: 64px; text-align: center; color: #c3b6db; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .toast { height: 22px; margin-top: 12px; color: #f2c66d; font-size: 0.85rem; }
  .note { margin-top: 18px; padding-top: 8px; color: #8f83ad; font-size: 0.8rem; text-align: center; }
  .divider { width: 100%; height: 1px; background: rgba(255,255,255,0.10); margin: 26px 0 20px; }
  .bonus { width: 100%; border-radius: 18px; padding: 20px; text-align: center;
    background: linear-gradient(165deg, rgba(242,198,109,0.10), rgba(242,198,109,0.02));
    border: 1px solid rgba(242,198,109,0.30); }
  .bonusHead { display: inline-flex; align-items: center; gap: 8px; color: #f2c66d; font-weight: 600; font-size: 0.95rem; }
  .bonusSub { color: #c3b6db; font-size: 0.86rem; margin: 8px 0 14px; }
  .bonusRow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #wInput { width: 150px; text-align: center; letter-spacing: 0.35em; text-transform: uppercase;
    font-size: 1rem; font-weight: 600; padding: 11px 12px 11px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(242,198,109,0.35); color: #f4eee4; outline: none; }
  #wInput::placeholder { color: #7d7299; letter-spacing: 0.2em; font-weight: 500; }
  #wBtn { padding: 11px 20px; border-radius: 12px; cursor: pointer; font-weight: 600;
    background: #f2c66d; border: none; color: #241539; transition: all .2s ease; }
  #wBtn:disabled { opacity: 0.6; cursor: default; }
  .bonusStatus { min-height: 18px; margin: 12px 0 0; font-size: 0.82rem; color: #c3b6db; }
  .bonusQ { font-size: clamp(1.3rem,4.6vw,1.8rem); margin: 10px 0 16px; }
  .rise { animation: bu-rise .7s ease both; }
  .rise2 { animation: bu-rise .7s ease .1s both; }
  @keyframes bu-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes bu-twinkle { 0%,100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * 0.35); } }
  @media (prefers-reduced-motion: reduce) {
    .card, .rise, .rise2, .star { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="root" id="app" tabindex="0">
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="wrap">
    <header class="rise">
      <div class="moon">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M23 20.5A9.5 9.5 0 0111.8 6.2 9.5 9.5 0 1023 20.5z" fill="#f2c66d" fill-opacity="0.9"/></svg>
      </div>
      <h1 class="title">Between Us</h1>
      <p class="date" id="date"></p>
    </header>

    <div class="persp rise2">
      <div class="card" id="card" role="button" aria-label="Tap to reveal the question">
        <div class="face front" id="front">
          <div class="frontinner">
            <span class="pill" id="pillFront"></span>
            <div class="num" id="num">1</div>
            <p class="hint" id="hint">Tap to reveal</p>
          </div>
        </div>
        <div class="face back" id="back">
          <div class="backinner">
            <span class="pill" id="pillBack"></span>
            <div class="qwrap"><p class="qtext" id="q"></p></div>
            <div class="controls">
              <button class="iconbtn" id="fav" aria-label="Save favourite"></button>
              <span class="takelabel">Take turns answering</span>
              <button class="iconbtn" id="copy" aria-label="Copy question">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 15V5.5A1.5 1.5 0 016.5 4H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="dots" id="dots"></div>

    <div class="nav">
      <button class="navbtn" id="prev" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="transform:scaleX(-1)" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="counter" id="counter">1 of 5</span>
      <button class="navbtn" id="next" aria-label="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>
    <p class="note" id="note">New questions every day.</p>

    <div class="divider"></div>
    <div class="bonus" id="bonus">
      <div class="bonusHead">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6"/></svg>
        Bonus question
      </div>
      <div id="bonusLocked">
        <p class="bonusSub">Enter today's Wordle answer to unlock a bonus question.</p>
        <div class="bonusRow">
          <input id="wInput" maxlength="5" placeholder="WORDLE" autocomplete="off" spellcheck="false" aria-label="Today's Wordle answer" />
          <button id="wBtn">Unlock</button>
        </div>
        <p class="bonusStatus" id="wStatus"></p>
      </div>
      <div id="bonusOpen" style="display:none">
        <span class="pill" style="background:#f2c66d1f;border:1px solid #f2c66d55;color:#f2c66d"><span class="pdot" style="background:#f2c66d"></span>Bonus</span>
        <p class="qtext bonusQ" id="bonusQ"></p>
        <button class="iconbtn" id="bonusCopy" aria-label="Copy bonus question" style="margin:0 auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 15V5.5A1.5 1.5 0 016.5 4H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script>
// Questions live in questions.csv (same folder as this page).
// Columns: category,question
// Categories: back, future, us, believe, fun, heart, sport, intimacy (Fridays), bonus (Wordle unlock)
// Questions are used in the order they appear in the file, so add new ones at the bottom.
const QUESTIONS_FILE = "questions.csv";

// The day the question cycle starts counting from. Leave this alone, or the
// order resets.
const START_DATE = new Date(2026, 9, 1); // 1 October 2026

const THREADS = {
  back:    { label: "Looking back",    color: "#e79a8f" },
  future:  { label: "Dreams & future", color: "#f2c66d" },
  us:      { label: "Us",              color: "#ef9bb3" },
  believe: { label: "What you believe",color: "#9db4f0" },
  fun:     { label: "Just for fun",    color: "#86d6c0" },
  heart:   { label: "Heart",           color: "#ef8f8f" },
  sport:   { label: "Game day",        color: "#a8d672" },
  intimacy:{ label: "Intimacy",        color: "#e06a86" },
};

const DAILY_KEYS = ["back", "future", "us", "believe", "fun", "heart", "sport"];
let BANK = {};      // filled from the CSV: { back: [...], future: [...], ... }
let INTIMACY = [];  // once a week, on Fridays
let BONUS = [];     // unlocked with the day's Wordle

// --- CSV loading ---
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else if (c === '"') { inQuotes = true; }
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else { field += c; }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function loadQuestions() {
  const res = await fetch(QUESTIONS_FILE, { cache: "no-store" });
  if (!res.ok) throw new Error("Couldn't load " + QUESTIONS_FILE + " (" + res.status + ")");
  const bank = {};
  DAILY_KEYS.forEach(function (k) { bank[k] = []; });
  const intimacy = [], bonus = [];
  parseCSV(await res.text()).forEach(function (r) {
    const cat = (r[0] || "").trim().toLowerCase();
    const q = (r[1] || "").trim();
    if (!q) return;
    if (bank[cat]) bank[cat].push(q);
    else if (cat === "intimacy") intimacy.push(q);
    else if (cat === "bonus") bonus.push(q);
    // anything else (including the header row) is ignored
  });
  BANK = bank; INTIMACY = intimacy; BONUS = bonus;
}

// deterministic RNG so a given day is identical for both people
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function dayNumber(d) {
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}
const START_DAY = dayNumber(START_DATE);

// Pick five questions for the day, one per thread.
// Replays every day since START_DATE so each thread knows how many of its
// questions have already been used, then takes the next one in file order.
// Each day uses the threads that have been shown least, so they all move
// through their lists evenly and nothing repeats until a whole list is used.
function dailySet(now) {
  const today = Math.max(dayNumber(now), START_DAY);
  const keys = DAILY_KEYS.filter(function (k) { return BANK[k].length; });
  const uses = {};
  keys.forEach(function (k) { uses[k] = 0; });
  let fridays = 0, res = [];

  for (let d = START_DAY; d <= today; d++) {
    const isFriday = (d + 4) % 7 === 5 && INTIMACY.length > 0; // day 0 (1 Jan 1970) was a Thursday
    const rng = mulberry32(d + 1);
    const ranked = keys.map(function (k) { return { k: k, r: rng() }; })
      .sort(function (a, b) { return (uses[a.k] - uses[b.k]) || (a.r - b.r); });
    const picked = ranked.slice(0, isFriday ? 4 : 5).map(function (x) { return x.k; });

    if (d === today) {
      res = shuffle(picked.slice(), rng).map(function (k) {
        const i = uses[k] % BANK[k].length;
        return { id: k + "-" + i, thread: k, q: BANK[k][i] };
      });
      if (isFriday) {
        const i = fridays % INTIMACY.length;
        res.push({ id: "intimacy-" + i, thread: "intimacy", q: INTIMACY[i], weekly: true });
      }
    }
    picked.forEach(function (k) { uses[k]++; });
    if (isFriday) fridays++;
  }
  return res;
}

// --- state ---
const now = new Date();
let cards = [];
let index = 0;
const revealed = [false, false, false, false, false];
const faves = new Set();
let toastTimer = null;

const $ = function (id) { return document.getElementById(id); };

function heartSVG(filled) {
  return '<svg width="20" height="20" viewBox="0 0 24 24" fill="' + (filled ? 'currentColor' : 'none') + '" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C.9 8.6 2.2 5.5 5.2 5.5c1.8 0 3 1 2.8 1 .8-.9 1.9-1.5 3-1.5 3 0 4.3 3.1 2.7 6C19 15.65 12 20 12 20z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}

function pillHTML(t, weekly) {
  return '<span class="pdot" style="background:' + t.color + '"></span>' + t.label +
    (weekly ? '<span class="weekly" style="border-left:1px solid ' + t.color + '55">Once a week</span>' : '');
}

// --- starfield ---
(function () {
  let seed = 7;
  const rnd = function () { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  // four-point sparkle for the bigger stars, a soft glowing dot for the small ones
  const SPARKLE = '<svg viewBox="0 0 24 24"><path d="M12 0C12.9 7.2 16.8 11.1 24 12 16.8 12.9 12.9 16.8 12 24 11.1 16.8 7.2 12.9 0 12 7.2 11.1 11.1 7.2 12 0Z" fill="currentColor"/></svg>';
  const DOT = '<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="currentColor"/></svg>';
  let s = '';
  for (let i = 0; i < 46; i++) {
    const x = rnd() * 100, y = rnd() * 70;
    const big = rnd() < 0.45 && (x < 20 || x > 80); // big sparkles stay off the title and card
    const size = big ? 9 + rnd() * 9 : 2 + rnd() * 2.5;
    const o = big ? 0.55 + rnd() * 0.4 : 0.35 + rnd() * 0.5, d = rnd() * 4;
    s += '<span class="star" style="left:' + x + '%;top:' + y + '%;width:' + size + 'px;height:' + size + 'px;--o:' + o +
      ';opacity:' + o + ';animation:bu-twinkle ' + (3 + d) + 's ease-in-out ' + d + 's infinite">' + (big ? SPARKLE : DOT) + '</span>';
  }
  $('stars').innerHTML = s;
})();

// --- dots ---
const dotEls = [];
(function () {
  const wrap = $('dots');
  for (let i = 0; i < 5; i++) {
    const b = document.createElement('button');
    b.className = 'dot';
    b.setAttribute('aria-label', 'Go to question ' + (i + 1));
    b.addEventListener('click', function () { goTo(i); });
    wrap.appendChild(b);
    dotEls.push(b);
  }
})();

$('date').textContent = now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });

function render() {
  if (!cards.length) return;
  const card = cards[index];
  const t = THREADS[card.thread];

  [$('front'), $('back')].forEach(function (f) {
    f.style.border = '1px solid ' + t.color + '44';
    f.style.boxShadow = '0 24px 60px -24px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.08), 0 0 42px -18px ' + t.color + '66';
  });

  [$('pillFront'), $('pillBack')].forEach(function (p) {
    p.style.background = t.color + '1f';
    p.style.border = '1px solid ' + t.color + '55';
    p.style.color = t.color;
    p.innerHTML = pillHTML(t, card.weekly);
  });

  const n = $('num'); n.textContent = index + 1; n.style.color = t.color;
  $('q').textContent = card.q;

  const isFave = faves.has(card.id);
  const fav = $('fav');
  fav.innerHTML = heartSVG(isFave);
  fav.style.color = isFave ? '#ef8f8f' : '#e5ddf1';
  fav.setAttribute('aria-pressed', isFave);
  fav.setAttribute('aria-label', isFave ? 'Remove favourite' : 'Save favourite');

  const cardEl = $('card');
  cardEl.classList.toggle('flipped', revealed[index]);
  cardEl.style.cursor = revealed[index] ? 'default' : 'pointer';

  dotEls.forEach(function (d, i) {
    const active = i === index;
    d.style.width = active ? '26px' : '9px';
    d.style.background = active ? THREADS[cards[i].thread].color
      : (revealed[i] ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.2)');
  });

  $('prev').disabled = index === 0;
  $('next').disabled = index === 4;
  $('counter').textContent = (index + 1) + ' of 5';
  $('note').textContent = revealed.every(Boolean)
    ? "That's tonight's five. New questions tomorrow."
    : "New questions every day.";
}

function clearToast() { $('toast').textContent = ''; }

function goTo(i) {
  if (i < 0 || i > 4 || !cards.length) return;
  index = i;
  clearToast();
  const cardEl = $('card');
  cardEl.classList.add('noanim');
  render();
  void cardEl.offsetWidth;
  cardEl.classList.remove('noanim');
}

function reveal() {
  if (!cards.length || revealed[index]) return;
  revealed[index] = true;
  render();
}

function copyQ(text) {
  try { navigator.clipboard.writeText(text); } catch (e) {}
  const t = $('toast');
  t.textContent = 'Copied — go send it \u{1F49B}';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.textContent = ''; }, 1600);
}

// --- events ---
$('card').addEventListener('click', reveal);
$('fav').addEventListener('click', function (e) {
  e.stopPropagation();
  if (!cards.length) return;
  const id = cards[index].id;
  if (faves.has(id)) faves.delete(id); else faves.add(id);
  render();
});
$('copy').addEventListener('click', function (e) {
  e.stopPropagation();
  if (cards.length) copyQ(cards[index].q);
});
$('prev').addEventListener('click', function () { goTo(index - 1); });
$('next').addEventListener('click', function () { goTo(index + 1); });
$('app').addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') { e.preventDefault(); goTo(index + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(index - 1); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); reveal(); }
});

// --- start: load the CSV, then build today's set ---
loadQuestions().then(function () {
  cards = dailySet(now);
  goTo(0);
}).catch(function (err) {
  console.error(err);
  $('hint').textContent = "Couldn't load today's questions.";
  $('note').textContent = "Make sure " + QUESTIONS_FILE + " sits in the same folder as this page.";
});

// ---------- Bonus question, unlocked with the day's Wordle ----------
const bonusDayNum = dayNumber(now);

function ymd(d) {
  const p = function (n) { return String(n).padStart(2, "0"); };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

// Best-effort: read today's official Wordle answer. Tries NYT directly, then
// a couple of public CORS proxies. Returns the solution, or null if unreachable.
async function fetchSolution() {
  const base = "https://www.nytimes.com/svc/wordle/v2/" + ymd(now) + ".json";
  const urls = [
    base,
    "https://corsproxy.io/?url=" + encodeURIComponent(base),
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(base),
  ];
  for (let i = 0; i < urls.length; i++) {
    try {
      const r = await fetch(urls[i], { cache: "no-store" });
      if (!r.ok) continue;
      const data = await r.json();
      if (data && data.solution) return String(data.solution).toUpperCase();
    } catch (e) { /* try next source */ }
  }
  return null;
}

function unlockBonus() {
  $("bonusLocked").style.display = "none";
  $("bonusOpen").style.display = "block";
  $("bonusQ").textContent = BONUS.length
    ? BONUS[Math.max(bonusDayNum - START_DAY, 0) % BONUS.length] : "";
}

(function () {
  const input = $("wInput"), btn = $("wBtn"), status = $("wStatus");

  input.addEventListener("input", function () {
    input.value = input.value.replace(/[^a-zA-Z]/g, "").toUpperCase().slice(0, 5);
  });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  btn.addEventListener("click", submit);

  async function submit() {
    const guess = input.value.trim().toUpperCase();
    if (guess.length !== 5) { status.textContent = "Type the five-letter Wordle answer."; return; }
    btn.disabled = true; status.textContent = "Checking…";
    const sol = await fetchSolution();
    btn.disabled = false;
    if (sol) {
      if (guess === sol) { status.textContent = ""; unlockBonus(); }
      else { status.textContent = "That's not today's Wordle. Try again."; }
    } else {
      status.textContent = "Couldn't check online, so unlocked on trust.";
      unlockBonus();
    }
  }
})();

$("bonusCopy").addEventListener("click", function () {
  copyQ($("bonusQ").textContent);
});
</script>
</body>
